<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لعبة المتاهة</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="game-page">

        <!-- المتاهة -->

        <div class="maze-container">

            <svg
                id="maze"
                viewBox="0 0 300 300"
                preserveAspectRatio="xMidYMid meet">
            </svg>

        </div>


        <!-- طبقة الفوز -->

        <div
            id="winnerOverlay"
            class="winner-overlay hidden">

            <div class="winner-box">

                <div class="winner-title">
                    🏆
                </div>

                <div class="winner-subtitle">
                    الفائز
                </div>


                <div class="winner-avatar-wrapper">

                    <img
                        id="winnerAvatar"
                        class="winner-avatar"
                        src=""
                        alt="الفائز">

                </div>


                <div
                    id="winnerName"
                    class="winner-name">
                </div>


                <button
                    id="resetButton"
                    class="reset-button">

                    🔄 إعادة اللعب

                </button>

            </div>

        </div>

    </main>


    <script src="/socket.io/socket.io.js"></script>

    <script src="game.js"></script>

</body>

</html>
