<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إدارة اللعبة - لعبة المتاهة التفاعلية</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="registration-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="registration-header">

        <div class="header-right">
            SAMI LIVE
        </div>

        <div class="header-center">
            لعبة المتاهة التفاعلية
        </div>

        <div
            id="connectionStatus"
            class="header-left">

            🟢 متصل

        </div>

    </header>



    <main class="registration-content">


        <!-- =====================================
             GAME MODE
        ====================================== -->

        <section class="settings-card">

            <div class="settings-title">
                🎮 إعدادات اللعبة
            </div>


            <div class="setting-row">

                <label for="gameMode">
                    مود اللعبة
                </label>

                <select id="gameMode">

                    <option value="treasure">
                        💎 مود الكنز
                    </option>

                    <option value="chase">
                        👹 مود المطاردة
                    </option>

                    <option value="nahroush">
                        🏃 مود القبض على نهروش
                    </option>

                </select>

            </div>


            <div class="setting-row">

                <label for="joinKeyword">
                    كلمة التسجيل
                </label>

                <div class="keyword-control">

                    <input
                        id="joinKeyword"
                        type="text"
                        value="JOIN"
                        maxlength="20"
                        autocomplete="off"
                    >

                    <button
                        id="saveKeywordButton"
                        type="button">

                        حفظ

                    </button>

                </div>

            </div>


            <div class="registration-control">

                <div>

                    <strong>
                        حالة التسجيل
                    </strong>

                    <small id="registrationStatusText">
                        التسجيل مفتوح
                    </small>

                </div>


                <button
                    id="registrationToggle"
                    class="registration-toggle open">

                    🟢 التسجيل مفتوح

                </button>

            </div>

        </section>



        <!-- =====================================
             JOIN INSTRUCTION
        ====================================== -->

        <section class="join-section">

            <div class="join-icon">
                💬
            </div>

            <h1>
                اكتب في الشات
            </h1>


            <div
                id="currentKeyword"
                class="join-command">

                JOIN

            </div>


            <p>
                للانضمام إلى اللعبة
            </p>

        </section>



        <!-- =====================================
             PLAYERS
        ====================================== -->

        <section class="players-section">

            <div class="section-title">

                <span>
                    👥 اللاعبون المشاركون
                </span>

                <span
                    id="playerCount"
                    class="player-count">

                    0 / 20

                </span>

            </div>


            <div
                id="registrationPlayers"
                class="registration-player-list">

                <div class="empty-players">

                    في انتظار اللاعبين...

                </div>

            </div>

        </section>



        <!-- =====================================
             MOVEMENT
        ====================================== -->

        <section class="movement-section">

            <h2>
                🎮 طريقة الحركة
            </h2>


            <div class="movement-controls">


                <div class="movement-row">

                    <div class="direction">

                        <span class="arrow">
                            ⬆️
                        </span>

                        <strong>
                            U
                        </strong>

                        <small>
                            فوق
                        </small>

                    </div>

                </div>



                <div class="movement-row horizontal">

                    <div class="direction">

                        <span class="arrow">
                            ⬅️
                        </span>

                        <strong>
                            L
                        </strong>

                        <small>
                            يسار
                        </small>

                    </div>


                    <div class="direction">

                        <span class="arrow">
                            ➡️
                        </span>

                        <strong>
                            R
                        </strong>

                        <small>
                            يمين
                        </small>

                    </div>

                </div>



                <div class="movement-row">

                    <div class="direction">

                        <span class="arrow">
                            ⬇️
                        </span>

                        <strong>
                            D
                        </strong>

                        <small>
                            تحت
                        </small>

                    </div>

                </div>

            </div>


            <p class="movement-note">

                أرسل الحرف الإنجليزي في الشات للتحرك

            </p>

        </section>



        <!-- =====================================
             START
        ====================================== -->

        <section class="start-section">

            <button
                id="startButton"
                class="start-button"
                disabled>

                ▶️ بدء اللعب

            </button>


            <div
                id="registrationMessage"
                class="registration-message">

                في انتظار اللاعبين...

            </div>

        </section>


    </main>

</div>



<script src="/socket.io/socket.io.js"></script>

<script src="registration.js"></script>


</body>

</html>
