<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لعبة المتاهة التفاعلية</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="connect-page">

        <div class="connect-box">

            <h1>
                لعبة المتاهة التفاعلية
            </h1>

            <p class="subtitle">
                أدخل اسم مستخدم TikTok LIVE للاتصال
            </p>

            <label for="username">
                اسم مستخدم TikTok
            </label>

            <input
                id="username"
                type="text"
                placeholder="@username"
                autocomplete="off"
            >

            <button id="connectButton">
                🔴 اتصال بالـ LIVE
            </button>

            <div id="status" class="status">
                غير متصل
            </div>

        </div>

    </main>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        const socket = io();

        const usernameInput =
            document.getElementById("username");

        const connectButton =
            document.getElementById("connectButton");

        const status =
            document.getElementById("status");

        let username = "";


        // =========================================
        // الاتصال
        // =========================================

        connectButton.addEventListener("click", () => {

            username =
                usernameInput.value.trim();


            if (!username) {

                status.textContent =
                    "⚠️ أدخل اسم المستخدم أولاً";

                return;
            }


            username =
                username.replace(/^@/, "");


            connectButton.disabled = true;

            connectButton.textContent =
                "⏳ جاري الاتصال...";

            status.textContent =
                `جاري الاتصال بـ @${username}`;


            socket.emit(
                "connect_tiktok",
                username
            );

        });


        // =========================================
        // نجاح الاتصال
        // =========================================

        socket.on("tiktok_connected", (data) => {

            if (data.success) {

                status.textContent =
                    `🟢 تم الاتصال بـ @${username}`;


                sessionStorage.setItem(
                    "tiktokUsername",
                    username
                );


                /*
                 * الانتقال إلى صفحة التسجيل
                 */

                setTimeout(() => {

                    window.location.href =
                        "/registration.html";

                }, 700);

            }

            else {

                status.textContent =
                    "❌ فشل الاتصال: " +
                    (
                        data.error ||
                        "تعذر الاتصال بـ TikTok LIVE"
                    );


                connectButton.disabled = false;

                connectButton.textContent =
                    "🔴 اتصال بالـ LIVE";

            }

        });


        // =========================================
        // خطأ Socket
        // =========================================

        socket.on("connect_error", () => {

            status.textContent =
                "❌ تعذر الاتصال بالسيرفر";

            connectButton.disabled = false;

            connectButton.textContent =
                "🔴 اتصال بالـ LIVE";

        });


        // =========================================
        // Enter
        // =========================================

        usernameInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    connectButton.click();

                }

            }
        );

    </script>

</body>

</html>
