<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAMI LIVE MAZE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="connect-page">

        <div class="logo">
            SAMI LIVE
        </div>

        <h1>
            🎮 SAMI LIVE MAZE
        </h1>

        <p class="subtitle">
            لعبة المتاهة التفاعلية
        </p>


        <div class="connect-box">

            <label for="username">
                اسم مستخدم TikTok LIVE
            </label>

            <input
                id="username"
                type="text"
                placeholder="@username"
                autocomplete="off"
            >

            <button id="connectButton">
                🔴 اتصال بالـ LIVE
            </button>

            <div id="status" class="status">
                غير متصل
            </div>

        </div>

    </main>


    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        const usernameInput =
            document.getElementById("username");

        const connectButton =
            document.getElementById("connectButton");

        const status =
            document.getElementById("status");


        let username = "";


        // =========================================
        // زر الاتصال
        // =========================================

        connectButton.addEventListener("click", () => {

            username = usernameInput.value.trim();


            if (!username) {

                status.textContent =
                    "⚠️ أدخل اسم المستخدم أولاً";

                return;
            }


            // إزالة @ إذا كتبها المستخدم

            username = username.replace("@", "");


            connectButton.disabled = true;

            connectButton.textContent =
                "⏳ جاري الاتصال...";

            status.textContent =
                `جاري الاتصال بـ @${username}`;


            // إرسال اسم المستخدم إلى السيرفر

            socket.emit(
                "connect_tiktok",
                username
            );

        });


        // =========================================
        // نجاح الاتصال بـ TikTok
        // =========================================

        socket.on("tiktok_connected", (data) => {

            if (data.success) {

                status.textContent =
                    `🟢 تم الاتصال بـ @${username}`;


                // حفظ اسم الحساب للجلسة

                sessionStorage.setItem(
                    "tiktokUsername",
                    username
                );


                // الانتقال إلى اللعبة

                setTimeout(() => {

                    window.location.href =
                        "/registration.html";

                }, 800);


            } else {

                status.textContent =
                    "❌ فشل الاتصال: " +
                    (data.error ||
                     "تعذر الاتصال بـ TikTok LIVE");


                connectButton.disabled = false;

                connectButton.textContent =
                    "🔴 اتصال بالـ LIVE";

            }

        });


        // =========================================
        // فشل اتصال Socket.IO
        // =========================================

        socket.on("connect_error", () => {

            status.textContent =
                "❌ تعذر الاتصال بالسيرفر";


            connectButton.disabled = false;

            connectButton.textContent =
                "🔴 اتصال بالـ LIVE";

        });


        // =========================================
        // انقطاع Socket
        // =========================================

        socket.on("disconnect", () => {

            console.log(
                "Socket disconnected"
            );

        });


        // =========================================
        // السماح بالضغط على Enter
        // =========================================

        usernameInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    connectButton.click();

                }

            }
        );

    </script>

</body>

</html>
